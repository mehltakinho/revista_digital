<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revista Digital - One Piece</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Container principal que limita a largura da revista e a centraliza -->
    <div class="magazine-container">
        
        <!-- TOPO: Imagem principal do One Piece -->
        <header class="magazine-header">
            <!-- Certifique-se de que o nome da imagem do topo esteja correto aqui -->
            <img src="one-piece-logo.png" alt="One Piece Logo" class="main-img">
            
            <div class="header-title-box">
                <h1>Gear for getting better at your side gig</h1>
            </div>
        </header>

        <!-- MEIO: Seção dividida em duas colunas lado a lado -->
        <div class="magazine-content">
            
            <!-- Coluna Esquerda (Fundo Branco) -->
            <article class="column-left">
                <h2>YouTube revamps its Red subscription service to offer standalone music streaming</h2>
                <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Quisquam, voluptatum.</p>
                <!-- Pequeno bloco azul decorativo do modelo -->
                <div class="blue-square-graphic"></div>
            </article>

            <!-- Coluna Direita (Fundo Escuro) -->
            <aside class="column-right">
                <div class="logo-wirecutter">
                    <span>w</span> wirecutter
                </div>
                <p class="right-text">
                    Lorem ipsum dolor sit amet consecte Lorem ipsum dolor sit amet consecte
                </p>
            </aside>

        </div>

        <!-- RODAPÉ: Segunda imagem da revista -->
        <footer class="magazine-footer">
            <!-- Substitua pelo nome do arquivo da sua imagem de rodapé -->
            <img src="one-piece-footer.jpg" alt="Rodapé Revista" class="footer-img">
        </footer>

    </div>

</body>
</html>
